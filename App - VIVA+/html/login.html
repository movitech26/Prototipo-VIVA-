<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIVA+ | Login e Cadastro</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div class="app-container">
        
        <div id="login-screen" class="card active">
            <div class="header-logo">
                <div class="logo-img"><img src="../assets/logo.png" alt="logo-img"></div>
                <h1>Bem-vindo ao <span>Viva+</span></h1>
                <p>Entre para continuar sua jornada</p>
            </div>

            <form onsubmit="event.preventDefault();">
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" placeholder="e-mail" required>
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox"> Lembrar de mim
                    </label>
                    <a href="#" class="link">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-primary">Entrar →</button>
            </form>
            <div class="card-footer">
                Ainda não tem uma conta? 
                <button class="link-btn" onclick="toggleScreens('register')">Cadastre-se</button>
            </div>
        </div>

        <div id="register-screen" class="card">
            <div class="header-logo">
                <h1>Crie sua conta no <br><span>VIVA+</span></h1>
                <p>Comece sua jornada de saúde e movimento</p>
            </div>

            <form onsubmit="event.preventDefault();">
                <div class="input-group">
                    <label>Nome Completo</label>
                    <input type="text" placeholder="Nome Completo" required>
                </div>

                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" placeholder="e-mail" required>
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" placeholder="••••••••" required>
                </div>

                <div class="input-group">
                    <label>Confirmar Senha</label>
                    <input type="password" placeholder="••••••••" required>
                </div>

                <div class="sports-section">
                    <h3>Seus Esportes Favoritos</h3>
                    <p>Quais esportes você pratica ou deseja praticar?<br>
                    <strong>Selecione uma ou mais opções.</strong></p>

                    <div class="sports-grid">
                        <button type="button" class="sport-btn" onclick="toggleSport(this)">🛹 Skate</button>
                        <button type="button" class="sport-btn" onclick="toggleSport(this)">🚴 Ciclismo</button>
                        <button type="button" class="sport-btn" onclick="toggleSport(this)">🏀 Basquete</button>
                        <button type="button" class="sport-btn" onclick="toggleSport(this)">⚽ Futsal</button>
                        <button type="button" class="sport-btn" onclick="toggleSport(this)">🏐 Quadra de Areia</button>
                        <button type="button" class="sport-btn" onclick="toggleSport(this)">🏓 Tênis de Mesa</button>
                        <button type="button" class="sport-btn" onclick="toggleSport(this)">🏃 Corrida</button>
                        <button type="button" class="sport-btn" onclick="toggleSport(this)">🏋️ Academias</button>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Criar Minha Conta →</button>
            </form>

            <div class="card-footer">
                Já possui uma conta? 
                <button class="link-btn" onclick="toggleScreens('login')">Entrar</button>
            </div>
        </div>

    </div>

    <script src="../js/login.js"></script>
</body>
</html>
