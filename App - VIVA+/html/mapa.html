<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa</title>
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mapa.css">
</head>
<header>

</header>
<body>
    <div id="cabecalhonav"></div>

    <section>
        <div class="container-pesquisa">
            <div class="barra-de-pesquisa">
                <span class="lupa">🔍</span>
                <input type="text" placeholder="Buscar locais" id="campo-da-pesquisa">
            </div>
    
            <div class="botoes-filtro">
                <button class="filtro ativo">Todos</button>
                <button class="filtro">Ciclovia</button>
                <button class="filtro">Pistas de Skate</button>
                <button class="filtro">Quadras de Areia</button>
                <button class="filtro">Tênis de Mesa</button>
                <button class="filtro">Futsal</button>
                <button class="filtro">Basquete</button>
                <button class="filtro">Academias</button>
            </div>
        </div>
    </section>

    <section class="cards-mapa">
        <div class="lista-de-locais">
            <p class="quantidade-de-locais">Locais encontrados</p>
            <div class="cards" id="lista-de-cards"></div>
        </div>

        <div class="area-mapa">
            <div class="mapa-placeholder">
                <p>📍 Mapa de Caruaru</p>
                <p style="font-size: 13px; opacity: 0.6;">Aqui vai o mapa depois</p> <!--trecho por enquanto-->
            </div>
        </div>

    </section>

    <script src="../js/nav.js"></script>
    <script src="../js/mapa.js"></script>
</body>
<footer>
    
</footer>



</html>
